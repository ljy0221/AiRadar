services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: server1-zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    mem_limit: 512m
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: server1-kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_INTERNAL_PORT:-19092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${SERVER1_PUBLIC_HOST:-localhost}:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    restart: unless-stopped

  spark-master:
    build:
      context: ./spark
    container_name: server1-spark-master
    hostname: spark-master
    depends_on:
      - kafka
    ports:
      - "${SPARK_MASTER_PORT:-17077}:7077"
      - "${SPARK_MASTER_UI_PORT:-18080}:8080"
      - "${SPARK_APP_UI_PORT:-14040}:4040"
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_NO_DAEMONIZE: "true"
      BRONZE_BASE_PATH: ${BRONZE_BASE_PATH:-}
      SILVER_BASE_PATH: ${SILVER_BASE_PATH:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ../backend/build/libs/airadar-spark.jar:/opt/spark-jobs/airadar-spark.jar
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    mem_limit: 1g
    restart: unless-stopped

  spark-worker1:
    build:
      context: ./spark
    container_name: server1-spark-worker1
    hostname: spark-worker1
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_NO_DAEMONIZE: "true"
      BRONZE_BASE_PATH: ${BRONZE_BASE_PATH:-}
      SILVER_BASE_PATH: ${SILVER_BASE_PATH:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AI_SERVER_URL: http://${SERVER2_PRIVATE_HOST:-localhost}:${SERVER2_AI_SERVER_PORT:-18000}
      AI_SERVER_CONCURRENCY: ${AI_SERVER_CONCURRENCY:-20}
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-10}
      POSTGRES_JDBC_URL: jdbc:postgresql://${SERVER2_PRIVATE_HOST:-localhost}:${SERVER2_POSTGRES_PORT:-15432}/${POSTGRES_DB:-airadar}
      POSTGRES_USER: ${POSTGRES_USER:-airadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airadar_secret}
    volumes:
      - ../backend/build/libs/airadar-spark.jar:/opt/spark-jobs/airadar-spark.jar
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    mem_limit: 3g
    restart: unless-stopped

  crawler:
    build:
      context: ../crawling
    container_name: server1-crawler
    hostname: crawler
    depends_on:
      - kafka
    ports:
      - "${CRAWLER_PORT:-18002}:8002"
    environment:
      CRAWLER_TIMEOUT_SEC: ${CRAWLER_TIMEOUT_SEC:-60}
      CRAWLER_DELAY_SEC: ${CRAWLER_DELAY_SEC:-1.0}
      CRAWLER_KAFKA_ENABLED: "true"
      CRAWLER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CRAWLER_KAFKA_TOPIC_PREFIX: ${CRAWLER_KAFKA_TOPIC_PREFIX:-airader.raw}
      CRAWLER_KAFKA_CLIENT_ID: ${CRAWLER_KAFKA_CLIENT_ID:-airader-crawler}
      CRAWLER_KAFKA_ACKS: ${CRAWLER_KAFKA_ACKS:-all}
      CRAWLER_KAFKA_RETRIES: ${CRAWLER_KAFKA_RETRIES:-3}
      CRAWLER_KAFKA_LINGER_MS: ${CRAWLER_KAFKA_LINGER_MS:-50}
      CRAWLER_KAFKA_REQUEST_TIMEOUT_MS: ${CRAWLER_KAFKA_REQUEST_TIMEOUT_MS:-15000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RAW_S3_BUCKET: ${RAW_S3_BUCKET:-}
    mem_limit: 512m
    restart: unless-stopped

  airflow:
    build:
      context: ./airflow
    container_name: server1-airflow
    hostname: airflow
    depends_on:
      spark-master:
        condition: service_started
    env_file:
      - .env.server1
    ports:
      - "${AIRFLOW_PORT:-18081}:8080"
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username \"$${_AIRFLOW_WWW_USER_USERNAME:-admin}\" --password \"$${_AIRFLOW_WWW_USER_PASSWORD:-admin}\" --firstname admin --lastname admin --role Admin --email admin@example.com || true;
        airflow scheduler &
        exec airflow webserver
      "
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../backend/build/libs/airadar-spark.jar:/opt/spark-jobs/airadar-spark.jar
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      AIRFLOW_GID: ${AIRFLOW_GID:-0}

      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES:-False}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow_user}:${AIRFLOW_DB_PASSWORD:-airflow_secret}@${SERVER2_PRIVATE_HOST:-localhost}:${SERVER2_POSTGRES_PORT:-15432}/${POSTGRES_DB:-airadar}?options=-csearch_path%3Dairflow
      AIRFLOW__CELERY__RESULT_BACKEND: redis://${SERVER2_PRIVATE_HOST:-localhost}:${SERVER2_REDIS_PORT:-16379}/0
      AIRFLOW__CELERY__BROKER_URL: redis://${SERVER2_PRIVATE_HOST:-localhost}:${SERVER2_REDIS_PORT:-16379}/0
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change-me}
      AIRFLOW__WEBSERVER__BASE_URL: "https://j14b104a.p.ssafy.io/airflow"
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
      AIRFLOW__WEBSERVER__PROXY_FIX_X_PREFIX: "0"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 300
      AIRFLOW__WEBSERVER__WORKERS: 2
      AIRFLOW__CORE__PARALLELISM: 4
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
      AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type":"spark","host":"spark://spark-master","port":7077}'
      CRAWLING_API_BASE_URL: http://crawler:8002
      POSTGRES_URL: postgresql://${POSTGRES_USER:-airadar}:${POSTGRES_PASSWORD:-airadar_secret}@${SERVER2_PRIVATE_HOST:-localhost}:${SERVER2_POSTGRES_PORT:-15432}/${POSTGRES_DB:-airadar}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: ${CRAWLER_KAFKA_TOPIC_PREFIX:-airader.raw}
      BRONZE_BASE_PATH: ${BRONZE_BASE_PATH:-}
      SILVER_BASE_PATH: ${SILVER_BASE_PATH:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      POSTGRES_JDBC_URL: jdbc:postgresql://${SERVER2_PRIVATE_HOST:-localhost}:${SERVER2_POSTGRES_PORT:-15432}/${POSTGRES_DB:-airadar}
      POSTGRES_HOST: ${SERVER2_PRIVATE_HOST:-localhost}
      POSTGRES_PORT: ${SERVER2_POSTGRES_PORT:-15432}
      POSTGRES_DB: ${POSTGRES_DB:-airadar}
      POSTGRES_USER: ${POSTGRES_USER:-airadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airadar_secret}
    mem_limit: 6g
    restart: unless-stopped

  jenkins:
    build:
      context: ./jenkins
    container_name: server1-jenkins
    hostname: jenkins
    ports:
      - "${JENKINS_PORT:-18083}:8080"
      - "${JENKINS_AGENT_PORT:-15000}:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - ../..:/workspace
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Xmx768m -Dhudson.model.FullDuplexHttpChannel.DISABLE=true"
      JENKINS_OPTS: "--prefix=/jenkins"
    mem_limit: 4g
    restart: unless-stopped

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  jenkins-home:
