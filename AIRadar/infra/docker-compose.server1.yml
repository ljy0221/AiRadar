services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: server1-zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: server1-kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_INTERNAL_PORT:-19092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${SERVER1_PUBLIC_HOST:-localhost}:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: server1-postgres
    hostname: postgres
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-15432}:5432"
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=200
      -c effective_cache_size=1536MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airadar}
      POSTGRES_USER: ${POSTGRES_USER:-airadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airadar_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airadar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-init:
    image: postgres:16
    container_name: server1-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-airadar}
      PGUSER: ${POSTGRES_USER:-airadar}
      PGPASSWORD: ${POSTGRES_PASSWORD:-airadar_secret}
    entrypoint: >
      /bin/sh -c "
        set -eu;
        psql -v ON_ERROR_STOP=1 -c \"CREATE SCHEMA IF NOT EXISTS airflow;\";
        if [ \"$(psql -tAc \\\"SELECT 1 FROM pg_roles WHERE rolname='${AIRFLOW_DB_USER:-airflow_user}'\\\")\" != \"1\" ]; then
          psql -v ON_ERROR_STOP=1 -c \"CREATE USER ${AIRFLOW_DB_USER:-airflow_user} WITH PASSWORD '${AIRFLOW_DB_PASSWORD:-airflow_secret}';\";
        fi;
        psql -v ON_ERROR_STOP=1 -c \"GRANT ALL ON SCHEMA airflow TO ${AIRFLOW_DB_USER:-airflow_user};\";
        psql -v ON_ERROR_STOP=1 -c \"ALTER USER ${AIRFLOW_DB_USER:-airflow_user} SET search_path = airflow;\";
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: server1-redis
    hostname: redis
    ports:
      - "${REDIS_PUBLISHED_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  spark-master:
    build:
      context: ./spark
    container_name: server1-spark-master
    hostname: spark-master
    depends_on:
      - kafka
    ports:
      - "${SPARK_MASTER_PORT:-17077}:7077"
      - "${SPARK_MASTER_UI_PORT:-18080}:8080"
      - "${SPARK_APP_UI_PORT:-14040}:4040"
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_NO_DAEMONIZE: "true"
      BRONZE_BASE_PATH: ${BRONZE_BASE_PATH:-}
      SILVER_BASE_PATH: ${SILVER_BASE_PATH:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ../backend/build/libs:/opt/spark-jobs
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    restart: unless-stopped

  spark-worker1:
    build:
      context: ./spark
    container_name: server1-spark-worker1
    hostname: spark-worker1
    depends_on:
      - spark-master
      - ai-server
      - postgres
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-4g}
      SPARK_NO_DAEMONIZE: "true"
      BRONZE_BASE_PATH: ${BRONZE_BASE_PATH:-}
      SILVER_BASE_PATH: ${SILVER_BASE_PATH:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AI_SERVER_URL: http://ai-server:8000
      AI_SERVER_CONCURRENCY: ${AI_SERVER_CONCURRENCY:-20}
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-10}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-airadar}
      POSTGRES_USER: ${POSTGRES_USER:-airadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airadar_secret}
    volumes:
      - ../backend/build/libs:/opt/spark-jobs
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    restart: unless-stopped

  crawler:
    build:
      context: ../crawling
    container_name: server1-crawler
    hostname: crawler
    depends_on:
      - kafka
    ports:
      - "${CRAWLER_PORT:-18002}:8002"
    environment:
      CRAWLER_TIMEOUT_SEC: ${CRAWLER_TIMEOUT_SEC:-15}
      CRAWLER_DELAY_SEC: ${CRAWLER_DELAY_SEC:-1.0}
      CRAWLER_KAFKA_ENABLED: "true"
      CRAWLER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CRAWLER_KAFKA_TOPIC_PREFIX: ${CRAWLER_KAFKA_TOPIC_PREFIX:-airader.raw}
      CRAWLER_KAFKA_CLIENT_ID: ${CRAWLER_KAFKA_CLIENT_ID:-airader-crawler}
      CRAWLER_KAFKA_ACKS: ${CRAWLER_KAFKA_ACKS:-all}
      CRAWLER_KAFKA_RETRIES: ${CRAWLER_KAFKA_RETRIES:-3}
      CRAWLER_KAFKA_LINGER_MS: ${CRAWLER_KAFKA_LINGER_MS:-50}
      CRAWLER_KAFKA_REQUEST_TIMEOUT_MS: ${CRAWLER_KAFKA_REQUEST_TIMEOUT_MS:-15000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RAW_S3_BUCKET: ${RAW_S3_BUCKET:-}
    restart: unless-stopped

  ai-server:
    build:
      context: ../ai-server
    container_name: server1-ai-server
    hostname: ai-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AI_SERVER_PORT:-18000}:8000"
    environment:
      GMS_KEY: ${GMS_KEY:-}
      EMBEDDING_MODEL: paraphrase-multilingual-mpnet-base-v2
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-10}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-airadar}
      POSTGRES_USER: ${POSTGRES_USER:-airadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airadar_secret}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  airflow:
    build:
      context: ./airflow
    container_name: server1-airflow
    hostname: airflow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      postgres-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    ports:
      - "${AIRFLOW_PORT:-18081}:8080"
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username \"$${_AIRFLOW_WWW_USER_USERNAME:-admin}\" --password \"$${_AIRFLOW_WWW_USER_PASSWORD:-admin}\" --firstname admin --lastname admin --role Admin --email admin@example.com || true;
        exec airflow standalone
      "
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../backend/build/libs:/opt/spark-jobs
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      AIRFLOW_GID: ${AIRFLOW_GID:-0}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES:-False}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow_user}:${AIRFLOW_DB_PASSWORD:-airflow_secret}@postgres:5432/${POSTGRES_DB:-airadar}?options=-csearch_path%3Dairflow
      AIRFLOW__CELERY__RESULT_BACKEND: redis://redis:6379/0
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change-me}
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
      CRAWLING_API_BASE_URL: http://crawler:8002
      POSTGRES_URL: postgresql://${POSTGRES_USER:-airadar}:${POSTGRES_PASSWORD:-airadar_secret}@postgres:5432/${POSTGRES_DB:-airadar}
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: server1-backend
    hostname: backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-18888}:8888"
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-airadar}
      POSTGRES_USER: ${POSTGRES_USER:-airadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airadar_secret}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: server1-frontend
    hostname: frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-13000}:3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8888}
    restart: unless-stopped

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
  redis-data:
