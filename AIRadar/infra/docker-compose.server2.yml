services:
  spark-worker2:
    build:
      context: ./spark
    container_name: server2-spark-worker2
    hostname: spark-worker2
    ports:
      - "${SPARK_WORKER2_UI_PORT:-18082}:8082"
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://${SERVER1_PRIVATE_HOST:-localhost}:${SERVER1_SPARK_MASTER_PORT:-17077}
      SPARK_WORKER_WEBUI_PORT: "8082"
      SPARK_WORKER_CORES: ${SPARK_WORKER2_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER2_MEMORY:-4g}
      SPARK_NO_DAEMONIZE: "true"
      BRONZE_BASE_PATH: ${BRONZE_BASE_PATH:-}
      SILVER_BASE_PATH: ${SILVER_BASE_PATH:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AI_SERVER_URL: http://${SERVER1_PRIVATE_HOST:-localhost}:${SERVER1_AI_SERVER_PORT:-18000}
      AI_SERVER_CONCURRENCY: ${AI_SERVER_CONCURRENCY:-20}
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-10}
      POSTGRES_JDBC_URL: jdbc:postgresql://${SERVER1_PRIVATE_HOST:-localhost}:${SERVER1_POSTGRES_PORT:-15432}/${POSTGRES_DB:-airadar}
      POSTGRES_USER: ${POSTGRES_USER:-airadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airadar_secret}
    volumes:
      - ../backend/build/libs:/opt/spark-jobs
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://${SERVER1_PRIVATE_HOST:-localhost}:${SERVER1_SPARK_MASTER_PORT:-17077}
    restart: unless-stopped
