spring.application.name=AiRadar
server.port=8888

# ── DataSource ────────────────────────────────────────────────
# 환경변수 우선, 없으면 localhost 기본값 (로컬 개발용)
spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/airader}
spring.datasource.username=${POSTGRES_USER:airader}
spring.datasource.password=${POSTGRES_PASSWORD:airader_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# Flyway가 스키마를 관리하므로 Hibernate DDL은 none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── Redis ────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Spark (Job 설정, Spring Boot 서버와 무관) ─────────────────
spark.app.name=AiRader Silver Refinement Job
spark.master=local[*]
