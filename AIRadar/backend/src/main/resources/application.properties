spring.application.name=AiRadar
server.port=8888

# ── DataSource ────────────────────────────────────────────────
# 운영/도커 환경에서는 docker-compose가 주입하는 POSTGRES_* 값을 사용한다.
# 환경변수가 없을 때만 로컬 개발용 localhost 기본값을 사용한다.
spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/airadar}
spring.datasource.username=${POSTGRES_USER:airadar}
spring.datasource.password=${POSTGRES_PASSWORD:airadar_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# Flyway가 스키마를 관리하므로 Hibernate DDL은 none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── Redis ────────────────────────────────────────────────────
# 운영/도커 환경에서는 REDIS_HOST, REDIS_PORT를 주입받고
# 로컬 개발 환경에서는 localhost:6379를 사용한다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Kafka ────────────────────────────────────────────────────
# 운영/도커 환경에서는 KAFKA_BOOTSTRAP_SERVERS를 반드시 사용한다.
# server2-kafka:9092 같은 고정 주소를 직접 적지 말고 환경변수로 관리한다.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=airader-backend
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:local-dev-secret-key-minimum-32-chars-ok}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ── Spark (Job 설정, Spring Boot 서버와 무관) ─────────────────
spark.app.name=AiRader Silver Refinement Job
spark.master=local[*]

# ── Airflow (수동 트리거용) ──────────────────────────────────
airflow.base-url=${AIRFLOW_BASE_URL:http://airflow:8081}
airflow.username=${AIRFLOW_USERNAME:airflow}
airflow.password=${AIRFLOW_PASSWORD:airflow}
=======
# Mail
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}

# Newsletter
newsletter.enabled=${NEWSLETTER_ENABLED:false}
newsletter.from=${NEWSLETTER_FROM:no-reply@airadar.local}
newsletter.timezone=${NEWSLETTER_TIMEZONE:Asia/Seoul}
newsletter.schedule.monday.enabled=${NEWSLETTER_MONDAY_ENABLED:true}
newsletter.schedule.friday.enabled=${NEWSLETTER_FRIDAY_ENABLED:true}
newsletter.schedule.send-hour=${NEWSLETTER_SEND_HOUR:9}
newsletter.schedule.send-minute=${NEWSLETTER_SEND_MINUTE:0}
