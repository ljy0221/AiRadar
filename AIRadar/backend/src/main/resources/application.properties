spring.application.name=AiRadar
server.port=8888

# ?? DataSource ?????????????????????????????
spring.datasource.url=jdbc:postgresql://server2-postgres:5432/airadar
spring.datasource.username=${POSTGRES_USER:airadar}
spring.datasource.password=${POSTGRES_PASSWORD:airadar_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate ???????????????????????
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? Flyway ????????????????????????????????
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ?? Redis ????????????????????????????????
spring.data.redis.host=server2-redis
spring.data.redis.port=6379

# ?? Kafka ????????????????????????????????
spring.kafka.bootstrap-servers=server2-kafka:9092
spring.kafka.consumer.group-id=airader-backend
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ?? JWT ??????????????????????????????????
jwt.secret=${JWT_SECRET:local-dev-secret-key-minimum-32-chars-ok}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ?? Spark ????????????????????????????????
spark.app.name=AiRader Silver Refinement Job
spark.master=local[*]